<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        td {
            border: 2px solid #e0e0e0;
            padding: 0;
            height: 60px;
        }

        input {
            width: 100%;
            height: 100%;
            border: none;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            transition: background-color 0.2s;
        }

        input:focus {
            outline: none;
            background-color: #f0f4ff;
        }

        .config-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .config-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .repo-info {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #1565c0;
        }

        .repo-info strong {
            color: #0d47a1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editable Table</h1>
        <p class="subtitle">Edit the cells and submit to create a pull request</p>
        
        <table id="dataTable">
            <tr>
                <td><input type="text" value="A1" data-cell="A1"></td>
                <td><input type="text" value="B1" data-cell="B1"></td>
                <td><input type="text" value="C1" data-cell="C1"></td>
            </tr>
            <tr>
                <td><input type="text" value="A2" data-cell="A2"></td>
                <td><input type="text" value="B2" data-cell="B2"></td>
                <td><input type="text" value="C2" data-cell="C2"></td>
            </tr>
            <tr>
                <td><input type="text" value="A3" data-cell="A3"></td>
                <td><input type="text" value="B3" data-cell="B3"></td>
                <td><input type="text" value="C3" data-cell="C3"></td>
            </tr>
        </table>

        <div class="config-section">
            <h2>GitHub Configuration</h2>
            <div id="repoInfo" class="repo-info"></div>
            <div class="form-group">
                <label for="githubToken">GitHub Personal Access Token:</label>
                <input type="password" id="githubToken" placeholder="ghp_...">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Required to create pull requests. <a href="https://github.com/settings/tokens/new?description=Table%20Submit&scopes=repo" target="_blank" style="color: #667eea;">Create token</a>
                </small>
            </div>
        </div>

        <button onclick="submitToGitHub()">Create Pull Request</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // Detect repository from GitHub Pages URL
        function detectRepository() {
            const hostname = window.location.hostname;
            const pathname = window.location.pathname;
            
            let owner, repo;
            
            if (hostname.endsWith('.github.io')) {
                owner = hostname.replace('.github.io', '');
                
                const pathParts = pathname.split('/').filter(part => part.length > 0);
                
                if (pathParts.length > 0) {
                    repo = pathParts[0];
                } else {
                    repo = hostname;
                }
            } else {
                owner = null;
                repo = null;
            }
            
            return { owner, repo };
        }

        function displayRepoInfo() {
            const { owner, repo } = detectRepository();
            const repoInfoDiv = document.getElementById('repoInfo');
            
            if (owner && repo) {
                repoInfoDiv.innerHTML = `<strong>Detected Repository:</strong> ${owner}/${repo}`;
            } else {
                repoInfoDiv.innerHTML = '<strong>⚠️ Could not detect repository.</strong> Make sure this page is hosted on GitHub Pages.';
                repoInfoDiv.style.backgroundColor = '#fff3cd';
                repoInfoDiv.style.color = '#856404';
            }
        }

        async function submitToGitHub() {
            const { owner, repo } = detectRepository();
            const token = document.getElementById('githubToken').value.trim();

            if (!owner || !repo) {
                showStatus('error', 'Could not detect repository. Please ensure this page is hosted on GitHub Pages.');
                return;
            }

            if (!token) {
                showStatus('error', 'Please provide a GitHub Personal Access Token');
                return;
            }

            const cells = document.querySelectorAll('#dataTable input');
            let tableData = {};
            
            cells.forEach(cell => {
                const cellId = cell.getAttribute('data-cell');
                tableData[cellId] = cell.value;
            });

            showStatus('info', 'Creating pull request...');

            try {
                await createPullRequest(owner, repo, token, tableData);
            } catch (error) {
                showStatus('error', `Error: ${error.message}`);
            }
        }

        async function createPullRequest(owner, repo, token, tableData) {
            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const branchName = `table-update-${timestamp}`;

            // Step 1: Get the default branch
            const repoResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
            if (!repoResponse.ok) throw new Error('Failed to fetch repository info');
            const repoData = await repoResponse.json();
            const defaultBranch = repoData.default_branch;

            // Step 2: Get the latest commit SHA of the default branch
            const refResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${defaultBranch}`, { headers });
            if (!refResponse.ok) throw new Error('Failed to fetch branch reference');
            const refData = await refResponse.json();
            const latestCommitSha = refData.object.sha;

            // Step 3: Create a new branch
            const createBranchResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs`, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                    ref: `refs/heads/${branchName}`,
                    sha: latestCommitSha
                })
            });
            if (!createBranchResponse.ok) throw new Error('Failed to create branch');

            // Step 4: Create file content
            const fileContent = formatTableAsJSON(tableData);
            const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));
            const fileName = `data/table-${timestamp}.json`;

            // Step 5: Create the file in the new branch
            const createFileResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`, {
                method: 'PUT',
                headers,
                body: JSON.stringify({
                    message: `Add table data ${new Date().toLocaleString()}`,
                    content: encodedContent,
                    branch: branchName
                })
            });
            if (!createFileResponse.ok) throw new Error('Failed to create file');

            // Step 6: Create the pull request
            const prResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls`, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                    title: `Table Update - ${new Date().toISOString().split('T')[0]}`,
                    head: branchName,
                    base: defaultBranch,
                    body: formatPRBody(tableData)
                })
            });

            if (!prResponse.ok) {
                const error = await prResponse.json();
                throw new Error(error.message || 'Failed to create pull request');
            }

            const prData = await prResponse.json();
            showStatus('success', `Pull request created successfully! <a href="${prData.html_url}" target="_blank" style="color: #155724; font-weight: bold;">View PR #${prData.number}</a>`);
        }

        function formatTableAsJSON(data) {
            return JSON.stringify({
                timestamp: new Date().toISOString(),
                data: data
            }, null, 2);
        }

        function formatPRBody(data) {
            let body = '## Table Data\n\n';
            body += '| Column A | Column B | Column C |\n';
            body += '|----------|----------|----------|\n';
            body += `| ${data.A1} | ${data.B1} | ${data.C1} |\n`;
            body += `| ${data.A2} | ${data.B2} | ${data.C2} |\n`;
            body += `| ${data.A3} | ${data.B3} | ${data.C3} |\n`;
            body += '\n---\n';
            body += `*Submitted at: ${new Date().toLocaleString()}*`;
            return body;
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
            statusDiv.style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', displayRepoInfo);
    </script>
</body>
</html>
