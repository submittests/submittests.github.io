<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        td {
            border: 2px solid #e0e0e0;
            padding: 0;
            height: 60px;
        }

        input[type="text"] {
            width: 100%;
            height: 100%;
            border: none;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            transition: background-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #f0f4ff;
        }

        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1565c0;
            line-height: 1.6;
        }

        .info-box strong {
            color: #0d47a1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        noscript {
            display: block;
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editable Table</h1>
        <p class="subtitle">Edit the cells and submit to create an issue</p>
        
        <noscript>
            ✓ This form works without JavaScript!
        </noscript>

        <form method="GET" action="https://github.com/submittests/submittests.github.io/issues/new">
            <table>
                <tr>
                    <td><input type="text" name="A1" value="A1" required></td>
                    <td><input type="text" name="B1" value="B1" required></td>
                    <td><input type="text" name="C1" value="C1" required></td>
                </tr>
                <tr>
                    <td><input type="text" name="A2" value="A2" required></td>
                    <td><input type="text" name="B2" value="B2" required></td>
                    <td><input type="text" name="C2" value="C2" required></td>
                </tr>
                <tr>
                    <td><input type="text" name="A3" value="A3" required></td>
                    <td><input type="text" name="B3" value="B3" required></td>
                    <td><input type="text" name="C3" value="C3" required></td>
                </tr>
            </table>

            <input type="hidden" name="title" value="Table Update">
            <input type="hidden" name="body" id="issueBody" value="">

            <div class="info-box">
                <strong>How it works:</strong><br>
                1. Edit the table cells above<br>
                2. Click the button below<br>
                3. You'll be taken to GitHub with a pre-filled issue<br>
                4. Click "Submit new issue" to complete
            </div>

            <button type="submit">Create GitHub Issue</button>
        </form>
    </div>

    <script>
        // JavaScript enhancement (optional - form works without it)
        // This formats the issue body nicely when JS is available
        const form = document.querySelector('form');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = {};
            
            // Collect all table data
            for (let [key, value] of formData.entries()) {
                if (key !== 'title' && key !== 'body') {
                    data[key] = value;
                }
            }
            
            // Format as markdown table
            let body = '## Table Data\n\n';
            body += '| Column A | Column B | Column C |\n';
            body += '|----------|----------|----------|\n';
            body += `| ${data.A1} | ${data.B1} | ${data.C1} |\n`;
            body += `| ${data.A2} | ${data.B2} | ${data.C2} |\n`;
            body += `| ${data.A3} | ${data.B3} | ${data.C3} |\n`;
            body += '\n---\n';
            body += `*Submitted at: ${new Date().toLocaleString()}*`;
            
            // Create the GitHub issue URL with pre-filled content
            const baseUrl = 'https://github.com/submittests/submittests.github.io/issues/new';
            const title = `Table Update - ${new Date().toISOString().split('T')[0]}`;
            const url = `${baseUrl}?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
            
            // Open in same or new window
            window.location.href = url;
        });
    </script>
</body>
</html>
